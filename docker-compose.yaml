services:
  # 1. PostgreSQL with PGVector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: vector-db
    # Port 5432 is not exposed to the public internet for security; accessible internally within the docker network
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vector-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend Service
  backend:
    image: rajnish425/chatbot-backend:latest
    container_name: chatbot_app
    ports:
      # Map host port 80 to container port 8080 to receive Cloudflare HTTP traffic
      - "80:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vector-db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-root}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # Optimized JVM heap allocation for AWS t3.small (2GB RAM)
      - JAVA_TOOL_OPTIONS=-Xmx800m -Xms300m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    name: chatbot_pg_data