services:
  # 1. Local PostgreSQL with PGVector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: vector-db
    # Port 5432 is kept exposed on local machine for IDE / Spring Boot local access
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vector-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local Spring Boot Backend Service (Optional if running via IDE)
  backend:
    image: rajnish425/chatbot-backend:latest
    container_name: chatbot_app
    ports:
      # Port 8080 for local React frontend (http://localhost:8080)
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vector-db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - JAVA_TOOL_OPTIONS=-Xmx800m -Xms300m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    name: chatbot_pg_data