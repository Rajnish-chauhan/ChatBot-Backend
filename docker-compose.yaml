version: '3.8'

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: local-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: