services:
  # 1. PostgreSQL Database with PGVector Extension
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: vector-db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vector-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend Application
  backend:
    build: .
    container_name: chatbot_app
    ports:
      - "8080:8080"
    environment:
      # Database connection inside Docker network using the service name 'postgres'
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vector-db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

      # Inject API keys and secrets loaded automatically from your local .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
    name: chatbot_pg_data